      - '7777:7777'
    restart: always
    entrypoint: ["sh", "-c", "sleep 30 && java -jar wsreport-1.0-SNAPSHOT.jar"]
    volumes:
      - ./game-logs/wsreport_api:/app/logs
    networks:
      env-setup_mynetwork:
        ipv4_address: 10.5.0.12

