version: '3.0'

services:

  gameplatform_leaderboard:
    image: 'bancodegame/gameplatform_leaderboard:v1.1'
    build:
      context: .
      dockerfile: api/BoardService/Dockerfile
    ports:
      - '8087:8087'
    restart: always
    volumes:
      - ./game-logs/portal_api:/app/logs
    networks:
      env-setup_mynetwork:
        ipv4_address: 10.5.0.7

  gameplatform_vbee_api:
    image: 'bancodegame/gameplatform_vbee_api:v1.1'
    build:
      context: .
      dockerfile: api/vbee/Dockerfile
    restart: always
    volumes:
      - ./game-logs/vbee_api:/app/logs
    depends_on:
      - gameplatform_leaderboard
    networks:
      env-setup_mynetwork:
        ipv4_address: 10.5.0.8

  gameplatform_portal_api:
    image: 'bancodegame/gameplatform_portal_api:v1.1'
    build:
      context: .
      dockerfile: api/VinPlayPortal/Dockerfile
    ports:
      - '8081:8081'
    restart: always
    volumes:
    - ./game-logs/portal_api:/app/logs
    networks:
      env-setup_mynetwork:
        ipv4_address: 10.5.0.9

  gameplatform_backend_api:
    image: 'bancodegame/gameplatform_backend_api:v1.1'
    build:
      context: .
      dockerfile: api/VinPlayBackend/Dockerfile
    ports:
      - '8082:8082'
    restart: always
    volumes:
      - ./game-logs/backend_api:/app/logs
    networks:
      env-setup_mynetwork:
        ipv4_address: 10.5.0.10

  gameplatform_wspay_api:
    image: 'bancodegame/gameplatform_wspay_api:v1.1'
    build:
      context: .
      dockerfile: api/wspay/Dockerfile
    ports:
      - '18081:18081'
    restart: always
    entrypoint: ["sh", "-c", "sleep 30 && java -cp 'libs/*:wspay.jar' com.vinplay.pay.server.JettyServer"]
    environment:
      - A=a
#    network_mode: host
    volumes:
      - ./game-logs/wspay_api:/app/logs
    networks:
      env-setup_mynetwork:
        ipv4_address: 10.5.0.11

  gameplatform_wsreport_api:
