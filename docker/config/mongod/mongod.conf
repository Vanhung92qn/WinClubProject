# MongoDB 4.x — single-node dev (Docker entrypoint creates root from MONGO_INITDB_*)
# For replica set + keyFile use a dedicated ops doc; keyFile breaks root user init on fresh volume.
storage:
  dbPath: /data/db
  wiredTiger:
    engineConfig:
      cacheSizeGB: 1.5

net:
  bindIp: 0.0.0.0
  port: 27017

security:
  authorization: enabled
