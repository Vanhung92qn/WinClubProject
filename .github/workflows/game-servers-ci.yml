name: Game Servers CI — Build & Test

on:
  push:
    branches: [main]
    paths:
      - 'server/game/**'
      - 'server/banca/**'
      - 'server/VinPlayDAL/**'
      - 'server/VinPlayUserCore/**'
      - 'server/VbeeCommon/**'
      - 'server/VBeeSecurity/**'
      - 'server/BitzeroAll/**'
      - 'server/CardCoreLib/**'
      - 'server/build.gradle'
      - 'server/settings.gradle'
  pull_request:
    branches: [main]
    paths:
      - 'server/game/**'
      - 'server/banca/**'

env:
  JAVA_VERSION: '11'
  GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true'

jobs:
  # ── Build shared libs trước (game servers phụ thuộc) ─────────────────────
  build-shared:
    name: Build Shared Libraries
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Gradle permission
        run: chmod +x server/gradlew

      - name: Compute cache key
        id: cache-key
        run: echo "key=gradle-${{ runner.os }}-${{ hashFiles('server/**/*.gradle') }}" >> $GITHUB_OUTPUT

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build shared libs
        working-directory: server
        run: |
          ./gradlew :VbeeCommon:build \
                    :VBeeSecurity:build \
                    :VinPlayDAL:build \
                    :VinPlayUserCore:build \
                    :CardCoreLib:build \
                    :BitzeroAll:build \
                    -x test --info

      - name: Publish shared JARs
        uses: actions/upload-artifact@v4
        with:
          name: shared-libs-${{ github.sha }}
          path: |
            server/VbeeCommon/build/libs/*.jar
            server/VBeeSecurity/build/libs/*.jar
            server/VinPlayDAL/build/libs/*.jar
            server/VinPlayUserCore/build/libs/*.jar
            server/CardCoreLib/build/libs/*.jar
            server/BitzeroAll/build/libs/*.jar
          retention-days: 1

  # ── Build game servers theo nhóm ─────────────────────────────────────────
  build-dice-games:
    name: Build Dice Games
    needs: build-shared
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Gradle permission
        run: chmod +x server/gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ needs.build-shared.outputs.cache-key }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build Dice / Betting games
        working-directory: server
        run: |
          ./gradlew \
            :game:taixiuMini:build \
            :game:taixiuMd5:build \
            :game:taixiuKubet:build \
            :game:xocdia:build \
            :game:xocdiaKubet:build \
            -x test --info 2>&1 | tail -50
        continue-on-error: true   # Một số game có thể chưa migrate Gradle hoàn toàn

  build-card-games:
    name: Build Card Games
    needs: build-shared
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Gradle permission
        run: chmod +x server/gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ needs.build-shared.outputs.cache-key }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build Card games
        working-directory: server
        run: |
          ./gradlew \
            :game:bacay:build \
            :game:baicao:build \
            :game:binh:build \
            :game:poker:build \
            :game:sam:build \
            :game:lieng:build \
            :game:tlmn:build \
            -x test --info 2>&1 | tail -50
        continue-on-error: true

  build-slot-games:
    name: Build Slot / Mini Games
    needs: build-shared
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Gradle permission
        run: chmod +x server/gradlew

      - name: Build Slot / Mini games
        working-directory: server
        run: |
          ./gradlew \
            :game:slot:build \
            -x test --info 2>&1 | tail -50
        continue-on-error: true

  # ── Summary job ───────────────────────────────────────────────────────────
  ci-summary:
    name: CI Summary
    needs: [build-dice-games, build-card-games, build-slot-games]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Print status
        run: |
          echo "Dice games:  ${{ needs.build-dice-games.result }}"
          echo "Card games:  ${{ needs.build-card-games.result }}"
          echo "Slot games:  ${{ needs.build-slot-games.result }}"
          # Fail job nếu shared-libs failed (critical)
          if [ "${{ needs.build-dice-games.result }}" == "failure" ] && \
             [ "${{ needs.build-card-games.result }}" == "failure" ] && \
             [ "${{ needs.build-slot-games.result }}" == "failure" ]; then
            echo "All game builds failed — check shared libs!"
            exit 1
          fi
          echo "Game server CI complete ✓"
