; Copy to /etc/php/8.3/fpm/pool.d/cms.conf (adjust PHP version/socket).
; Set passwords via env file on the server — do not commit real values.
; After: sudo systemctl reload php8.3-fpm

[cms]
user = www-data
group = www-data
listen = /run/php/php8.3-fpm-cms.sock
listen.owner = www-data
listen.group = www-data
pm = dynamic
pm.max_children = 20
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
chdir = /

; CodeIgniter DB (see application/config/database.php)
env[DB_HOST_VINPLAY_ADMIN] = 127.0.0.1
env[DB_PORT_VINPLAY_ADMIN] = 3306
env[DB_USER_VINPLAY_ADMIN] = root
env[DB_PASS_VINPLAY_ADMIN] = CHANGE_ME
env[DB_NAME_VINPLAY_ADMIN] = vinplay_admin

env[DB_HOST_VINPLAY] = 127.0.0.1
env[DB_PORT_VINPLAY] = 3306
env[DB_USER_VINPLAY] = root
env[DB_PASS_VINPLAY] = CHANGE_ME
env[DB_NAME_VINPLAY] = vinplay

env[DB_HOST_MINIGAME] = 127.0.0.1
env[DB_PORT_MINIGAME] = 3306
env[DB_USER_MINIGAME] = root
env[DB_PASS_MINIGAME] = CHANGE_ME
env[DB_NAME_MINIGAME] = vinplay_minigame

; application/config/config.php (getenv)
env[BASE_URL] = https://quantri.example.com/
env[API_URL] = https://play.example.com/api
env[API_BACKEND] = http://127.0.0.1:8082/api_backend
env[WEB_SOCKET] = ws://127.0.0.1:7777/
