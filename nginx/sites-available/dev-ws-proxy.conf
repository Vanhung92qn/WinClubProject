# Dev/Preview: WebSocket proxy for direct IP access (no TLS)
# Allows ws://IP/socket-client/{game} from Cocos Creator Preview
# Install: sudo ln -sf /var/WinClubProject/nginx/sites-available/dev-ws-proxy.conf /etc/nginx/sites-enabled/
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # API portal (for Cocos Preview using http://IP:80)
    location /api {
        proxy_pass http://127.0.0.1:8081/api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, AccessToken" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # WebSocket game proxy routes (same as production but ws:// instead of wss://)
    include /etc/nginx/snippets/winclub-game-routes-ws.inc;
}
