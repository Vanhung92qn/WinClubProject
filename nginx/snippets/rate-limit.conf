# Rate limiting zones for WinClub API
# Include this file inside the http{} block of /etc/nginx/nginx.conf:
#
#   include /etc/nginx/snippets/rate-limit.conf;
#
# Deploy:
#   sudo cp nginx/snippets/rate-limit.conf /etc/nginx/snippets/
#   # Then add the include line to /etc/nginx/nginx.conf http{} block
#   sudo nginx -t && sudo nginx -s reload

# General API: 30 requests/second per IP, burst up to 50
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# Login endpoint (c=3): max 5 attempts/minute per IP — brute-force protection
# Applied at Nginx level by matching c=3 in map (see below)
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
