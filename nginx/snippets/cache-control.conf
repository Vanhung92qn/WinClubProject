# Cache-Control rules for WinClub web build.
# Include inside the server{} block of the site config:
#
#   include /etc/nginx/snippets/cache-control.conf;
#
# Deploy:
#   sudo cp nginx/snippets/cache-control.conf /etc/nginx/snippets/
#   sudo nginx -t && sudo nginx -s reload

# ── index.html — NEVER cache ──────────────────────────────────────────────────
# iOS Safari evicts background tabs and reloads. If index.html is cached,
# it may reference old bundle hashes → UUID mismatch → "e.bundleUrl" undefined.
location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
}

# ── Cocos bundle config & manifest files — short TTL ─────────────────────────
# config.json, project.manifest, version.manifest contain UUID→path mappings.
# Stale copies cause parseImport failures after a build update.
# 5-minute TTL + must-revalidate ensures browsers always check the server.
location ~* /assets/[^/]+/(config\.json|project\.manifest|version\.manifest)$ {
    add_header Cache-Control "public, max-age=300, must-revalidate" always;
}

# ── Cocos bundle index.js without content hash — no-cache ─────────────────────
# Bundle entry scripts that don't have a hash in the filename (e.g. index.js
# at the bundle root) must not be cached, or old code will run with new assets.
location ~* /assets/[^/]+/index\.js$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}

# ── Hashed static assets — cache forever ─────────────────────────────────────
# Files with content hash in filename (e.g. cocos2d-js-min.6fd15.js,
# index.cf8c1.js) are safe to cache permanently. Hash changes on each build.
location ~* \.[0-9a-f]{5,}\.(js|json|png|jpg|mp3|ogg|ttf|woff)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}
